<div class="px-1 pb-1">
  <h2 mat-dialog-title>
    {{ data.title }}
  </h2>

  <mat-dialog-content>
    <p class="text-sm leading-relaxed text-stone-600">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions !pt-4">
    <button class="btn-secondary"
            (click)="cancel()">
      {{ data.cancelLabel ?? ('ConfirmDialog.Cancel' | translate) }}
    </button>
    <button class="btn-danger"
            (click)="confirm()">
      {{ data.confirmLabel ?? ('ConfirmDialog.Confirm' | translate) }}
    </button>
  </mat-dialog-actions>
</div>

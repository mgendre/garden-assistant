<h2 class="dialog-header" [translate]="data.mode === 'create' ? 'Garden.DialogCreateTitle' : 'Garden.DialogEditTitle'"></h2>
<div class="dialog-body">
  <div class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Garden.NameLabel'"></label>
      <input type="text"
        class="form-input"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        maxlength="100"
        [attr.placeholder]="'Garden.NamePlaceholder' | translate" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Garden.DescriptionLabel'"></label>
      <textarea
        class="form-input"
        rows="3"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        maxlength="2000"
        [attr.placeholder]="'Garden.DescriptionPlaceholder' | translate">
      </textarea>
    </div>
  </div>
</div>
<div class="dialog-footer">
  <button class="btn btn-secondary btn-sm" (click)="cancel()" [translate]="'Garden.Cancel'"></button>
  <button class="btn btn-primary btn-sm" [disabled]="!isValid" (click)="save()"
    [translate]="data.mode === 'create' ? 'Garden.DialogCreateAction' : 'Garden.DialogSaveAction'"></button>
</div>

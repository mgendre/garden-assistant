<h2 mat-dialog-title [translate]="data.mode === 'create' ? 'Garden.DialogCreateTitle' : 'Garden.DialogEditTitle'"></h2>
<mat-dialog-content>
  <div class="flex flex-col gap-4 py-2">
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Garden.NameLabel'"></label>
      <input type="text"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        maxlength="100"
        [attr.placeholder]="'Garden.NamePlaceholder' | translate" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Garden.DescriptionLabel'"></label>
      <textarea
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
        rows="3"
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        maxlength="2000"
        [attr.placeholder]="'Garden.DescriptionPlaceholder' | translate">
      </textarea>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [translate]="'Garden.Cancel'"></button>
  <button mat-flat-button color="primary" [disabled]="!isValid" (click)="save()"
    [translate]="data.mode === 'create' ? 'Garden.DialogCreateAction' : 'Garden.DialogSaveAction'"></button>
</mat-dialog-actions>

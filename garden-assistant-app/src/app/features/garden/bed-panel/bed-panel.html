<div class="panel">
  <app-collapsible (click)="onExpand()">
    <div collapsible-header class="flex items-center justify-between w-full gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="font-medium truncate">{{ bed().name || ('Bed.Unnamed' | translate) }}</span>
        <span class="text-xs" style="color: var(--color-text-muted)">
          ({{ plantCount() }} {{ (plantCount() === 1 ? 'Bed.PlantSingular' : 'Bed.PlantPlural') | translate }})
        </span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button class="btn btn-ghost btn-xs" (click)="editBedName($event)" [attr.aria-label]="'Bed.Edit' | translate">
          <fa-icon [icon]="faPen" size="xs"></fa-icon>
        </button>
        <button class="remove-btn" (click)="deleteBed($event)" [attr.aria-label]="'Bed.Delete' | translate">
          <fa-icon [icon]="faTrash" size="xs"></fa-icon>
        </button>
      </div>
    </div>
    <div collapsible-body>
      @if (loading()) {
        <div class="empty-state" style="min-height: 100px">
          <div class="empty-state-icon">⏳</div>
        </div>
      } @else if (loaded()) {
        @if (plants().length === 0) {
          <div class="empty-state" style="min-height: 120px">
            <p class="empty-state-text" [translate]="'Bed.EmptyState'"></p>
            <button class="btn btn-primary btn-sm mt-3" (click)="editPlants()" [translate]="'Bed.AddPlants'"></button>
          </div>
        } @else {
          <app-plant-association-panel
            [plants]="plants()"
            [associations]="associations()"
            [calendarEntries]="calendarEntries()"
            [centralPlantIds]="centralPlantIds()"
            [interactive]="false"
            (plantNameClick)="openPlantDetail($event)"
            (harvestReadinessClick)="openHarvestReadiness($event)">
          </app-plant-association-panel>

          <div class="flex justify-center py-4">
            <button class="btn btn-primary btn-sm" (click)="editPlants()" [translate]="'Bed.ModifyPlants'"></button>
          </div>
        }
      }
    </div>
  </app-collapsible>
</div>

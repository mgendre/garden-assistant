<div class="panel">
  <app-collapsible>
    <div collapsible-header class="flex items-center gap-2 min-w-0">
      <span class="font-medium truncate">{{ bed().name || ('Bed.Unnamed' | translate) }}</span>
      <span class="text-xs" style="color: var(--color-text-muted)">
        ({{ plantCount() }} {{ (plantCount() === 1 ? 'Bed.PlantSingular' : 'Bed.PlantPlural') | translate }})
      </span>
    </div>
    <div collapsible-body>
      @if (loading()) {
        <div class="empty-state" style="min-height: 100px">
          <div class="empty-state-icon">⏳</div>
        </div>
      } @else {
        @if (plants().length === 0) {
          <div class="empty-state" style="min-height: 120px">
            <p class="empty-state-text" [translate]="'Bed.EmptyState'"></p>
            <button class="btn btn-primary btn-sm mt-3" (click)="editPlants()" [translate]="'Bed.AddPlants'"></button>
          </div>
        } @else {
          <app-plant-association-panel
            [plants]="plants()"
            [associations]="associations()"
            [calendarEntries]="calendarEntries()"
            [centralPlantIds]="centralPlantIds()"
            [interactive]="false"
            [showPlantCards]="true"
            (plantNameClick)="openPlantDetail($event)"
            (harvestReadinessClick)="openHarvestReadiness($event)">
          </app-plant-association-panel>
        }

        <div style="border-top: 1px solid var(--color-border); padding: 1rem 1.25rem">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.75rem">
            <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap">
              <button class="btn btn-secondary btn-sm" (click)="editPlants()">
                <fa-icon [icon]="faPen"></fa-icon>
                <span [translate]="'Bed.ModifyPlants'"></span>
              </button>
              <button class="btn btn-secondary btn-sm" (click)="editBedName($event)">
                <fa-icon [icon]="faPen"></fa-icon>
                <span [translate]="'Bed.EditName'"></span>
              </button>
            </div>
            <button class="btn btn-danger btn-sm" (click)="deleteBed($event)">
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </div>
        </div>
      }
    </div>
  </app-collapsible>
</div>

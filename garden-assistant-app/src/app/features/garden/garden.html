<!-- Page header -->
<div class="mb-8 flex items-center justify-between">
  <div>
    <p class="text-xs font-semibold uppercase tracking-widest text-canopy-muted">Manage</p>
    <h1 class="font-['DM_Serif_Display'] text-3xl text-forest lg:text-4xl">My Gardens</h1>
  </div>

  <button class="flex items-center gap-2 rounded-xl bg-earth px-5 py-2.5 text-sm font-semibold text-white shadow-md ring-1 ring-earth transition-all duration-200 hover:-translate-y-0.5 hover:bg-earth-dark hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-earth focus:ring-offset-2 focus:ring-offset-parchment"
          (click)="openCreateDialog()">
    <mat-icon class="!h-4 !w-4 !text-base !leading-none">add</mat-icon>
    Add Garden
  </button>
</div>

<!-- Loading state -->
@if (loading()) {
  <div class="flex flex-col items-center justify-center py-20 text-stone-400">
    <mat-spinner diameter="44"></mat-spinner>
    <p class="mt-5 text-sm">Loading your gardens…</p>
  </div>
}

<!-- Empty state -->
@else if (gardens().length === 0) {
  <div class="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-canopy/30 bg-cream/60 py-20 text-center">
    <div class="mb-4 text-5xl">🌱</div>
    <h2 class="font-['DM_Serif_Display'] text-2xl text-forest">No gardens yet</h2>
    <p class="mt-2 text-sm text-stone-500">Commencez à cultiver votre espace.</p>
    <button class="mt-5 flex items-center gap-2 rounded-xl border border-canopy px-5 py-2.5 text-sm font-semibold text-canopy transition-all hover:bg-canopy hover:text-white focus:outline-none focus:ring-2 focus:ring-canopy focus:ring-offset-2"
            (click)="openCreateDialog()">
      Créer mon premier jardin
    </button>
  </div>
}

<!-- Garden table -->
@else {
  <div class="overflow-hidden rounded-2xl border border-canopy/15 bg-cream shadow-sm">
    <table mat-table [dataSource]="gardens()" class="w-full">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef
            class="!border-b !border-canopy/15 !bg-parchment !px-6 !py-3.5 !text-left !text-xs !font-semibold !uppercase !tracking-widest !text-canopy">
          Name
        </th>
        <td mat-cell *matCellDef="let garden"
            class="!border-b !border-stone-100 !px-6 !py-4 !font-medium !text-forest">
          {{ garden.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef
            class="!border-b !border-canopy/15 !bg-parchment !px-6 !py-3.5 !text-left !text-xs !font-semibold !uppercase !tracking-widest !text-canopy">
          Description
        </th>
        <td mat-cell *matCellDef="let garden"
            class="!border-b !border-stone-100 !px-6 !py-4 !text-sm !text-stone-500">
          {{ garden.description || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef
            class="!border-b !border-canopy/15 !bg-parchment !px-6 !py-3.5 !w-16"></th>
        <td mat-cell *matCellDef="let garden"
            class="!border-b !border-stone-100 !px-6 !py-4">
          <button class="flex h-11 w-11 items-center justify-center rounded-lg text-stone-400 transition-all duration-200 hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-300"
                  (click)="deleteGarden(garden.id, garden.name)"
                  [attr.aria-label]="'Supprimer ' + garden.name">
            <mat-icon class="!h-4 !w-4 !text-base !leading-none">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="transition-colors duration-150 hover:!bg-parchment/60"></tr>
    </table>
  </div>
}

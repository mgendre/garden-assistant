<h2 class="dialog-header" [translate]="data.mode === 'create' ? 'Bed.DialogCreateTitle' : 'Bed.DialogEditTitle'"></h2>
<div class="dialog-body">
  <div class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Bed.NameLabel'"></label>
      <input type="text"
        class="form-input"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        maxlength="100"
        [attr.placeholder]="'Bed.NamePlaceholder' | translate" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" [translate]="'Bed.SoilTypeLabel'"></label>
      <select class="form-input"
              (change)="soilType.set($any($event.target).value)">
        @for (opt of soilTypeOptions; track opt.value) {
          <option [value]="opt.value" [selected]="opt.value === soilType()">{{ opt.labelKey | translate }}</option>
        }
      </select>
    </div>
    <div class="flex items-center gap-2">
      <input type="checkbox"
             class="form-checkbox"
             id="hasMulch"
             [checked]="hasMulch()"
             (change)="hasMulch.set($any($event.target).checked)" />
      <label for="hasMulch" class="text-sm cursor-pointer" [translate]="'Bed.HasMulchLabel'"></label>
    </div>
  </div>
</div>
<div class="dialog-footer">
  <button class="btn btn-secondary btn-sm" (click)="cancel()" [translate]="'Bed.Cancel'"></button>
  <button class="btn btn-primary btn-sm" (click)="save()"
    [translate]="data.mode === 'create' ? 'Bed.DialogCreateAction' : 'Bed.DialogSaveAction'"></button>
</div>

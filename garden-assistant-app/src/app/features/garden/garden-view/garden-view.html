<div class="page-container">
  <div class="page-header">
    <button class="btn btn-ghost btn-xs mb-2" (click)="goBack()">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
      <span [translate]="'Garden.BackToList'"></span>
    </button>
    <div class="flex items-center gap-3">
      <h1 class="flex-1 min-w-0 truncate">{{ garden()?.name }}</h1>
      <div class="garden-header-actions">
        <button class="btn btn-secondary btn-sm" (click)="editGarden()">
          <fa-icon [icon]="faPen"></fa-icon>
          <span [translate]="'Garden.Edit'"></span>
        </button>
        <button class="btn btn-danger btn-sm" (click)="deleteGarden()">
          <fa-icon [icon]="faTrash"></fa-icon>
        </button>
      </div>
    </div>
    @if (garden()?.description) {
      <p class="page-description">{{ garden()?.description }}</p>
    }
  </div>

  <div class="page-toolbar">
    <h2 [translate]="'Bed.SectionTitle'"></h2>
    <button class="btn btn-primary btn-sm" (click)="addBed()">
      <fa-icon [icon]="faPlus"></fa-icon>
      <span [translate]="'Bed.Add'"></span>
    </button>
  </div>

  @if (store.bedsLoading()) {
    <app-empty-state icon="⏳"></app-empty-state>
  } @else if (!hasBeds()) {
    <app-empty-state icon="🌱" messageKey="Bed.EmptyGarden" actionKey="Bed.CreateFirst" (actionClick)="addBed()"></app-empty-state>
  } @else {
    <div class="garden-panels">
      <div class="content-list">
        @for (bed of beds(); track bed.id) {
          <app-bed-panel
            [bed]="bed"
            [gardenId]="gardenId()"
            [open]="openBedId() === bed.id"
            (toggled)="toggleBed(bed.id!, $event)"
            (bedUpdated)="onBedUpdated(bed.id!, $event)"
            (bedDeleted)="onBedDeleted(bed.id!)">
          </app-bed-panel>
        }
      </div>

      <app-garden-calendar
        [beds]="beds()"
        [open]="activePanel() === 'calendar'"
        (toggled)="activePanel.set($event ? 'calendar' : null)">
      </app-garden-calendar>

      <app-garden-watering
        [gardenId]="gardenId()"
        [open]="activePanel() === 'watering'"
        (toggled)="activePanel.set($event ? 'watering' : null)">
      </app-garden-watering>
    </div>
  }
</div>

<div class="mx-auto max-w-3xl px-4 py-6">
  <div class="flex items-center gap-3 mb-2">
    <button class="btn btn-ghost btn-sm" (click)="goBack()" [attr.aria-label]="'Garden.Back' | translate">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
    </button>
    <h1 class="flex-1 min-w-0 truncate">{{ garden()?.name }}</h1>
    <button class="btn btn-ghost btn-sm" (click)="editGarden()" [attr.aria-label]="'Garden.Edit' | translate">
      <fa-icon [icon]="faPen"></fa-icon>
    </button>
  </div>

  @if (garden()?.description) {
    <p class="text-sm text-gray-500 mb-6 ml-10">{{ garden()?.description }}</p>
  }

  <div class="flex items-center justify-between mb-4">
    <h2 [translate]="'Bed.SectionTitle'"></h2>
    <button class="btn btn-primary btn-sm" (click)="addBed()">
      <fa-icon [icon]="faPlus"></fa-icon>
      <span [translate]="'Bed.Add'"></span>
    </button>
  </div>

  @if (store.bedsLoading()) {
    <div class="empty-state">
      <div class="empty-state-icon">⏳</div>
    </div>
  } @else if (!hasBeds()) {
    <div class="empty-state">
      <div class="empty-state-icon">🌱</div>
      <p class="empty-state-text" [translate]="'Bed.EmptyGarden'"></p>
      <button class="btn btn-primary btn-sm mt-4" (click)="addBed()" [translate]="'Bed.CreateFirst'"></button>
    </div>
  } @else {
    <div class="flex flex-col gap-3">
      @for (bed of beds(); track bed.id) {
        <app-bed-panel
          [bed]="bed"
          [gardenId]="gardenId()"
          (bedNameChanged)="onBedRenamed(bed.id!, $event)"
          (bedDeleted)="onBedDeleted(bed.id!)">
        </app-bed-panel>
      }
    </div>

    @if (beds().length > 0) {
      <div class="mt-8">
        <app-garden-calendar [beds]="beds()"></app-garden-calendar>
      </div>
    }
  }
</div>

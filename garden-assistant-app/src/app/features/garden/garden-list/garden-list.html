<div class="page-container">
  <div class="page-header">
    <h1 [translate]="'Garden.Title'"></h1>
  </div>

  <div class="page-toolbar">
    <button class="btn btn-primary btn-sm" (click)="createGarden()">
      <fa-icon [icon]="faPlus"></fa-icon>
      <span [translate]="'Garden.Create'"></span>
    </button>
  </div>

  @if (isEmpty()) {
    <div class="empty-state">
      <div class="empty-state-icon">🌱</div>
      <p class="empty-state-text" [translate]="'Garden.EmptyState'"></p>
      <button class="btn btn-primary btn-sm mt-4" (click)="createGarden()" [translate]="'Garden.CreateFirst'"></button>
    </div>
  }

  @if (store.loading()) {
    <div class="empty-state">
      <div class="empty-state-icon">⏳</div>
    </div>
  }

  <div class="content-list">
    @for (garden of gardens(); track garden.id) {
      <div class="panel garden-card"
        (click)="openGarden(garden)"
        (keydown.enter)="openGarden(garden)"
        tabindex="0"
        role="link"
        [attr.aria-label]="garden.name">
        <div class="flex items-center gap-4 p-4 sm:p-5">
          <div class="garden-card-icon" aria-hidden="true">🌿</div>
          <div class="flex-1 min-w-0">
            <h3 class="truncate">{{ garden.name }}</h3>
            @if (garden.description) {
              <p class="text-sm mt-1 line-clamp-2" style="color: var(--color-text-muted)">{{ garden.description }}</p>
            }
            <div class="flex items-center gap-1.5 mt-2">
              <fa-icon [icon]="faLayerGroup" class="text-xs" style="color: var(--color-canopy-muted)"></fa-icon>
              <span class="text-xs font-medium" style="color: var(--color-text-muted)">
                {{ garden.bedCount }} {{ (garden.bedCount === 1 ? 'Garden.BedSingular' : 'Garden.BedPlural') | translate }}
              </span>
            </div>
          </div>
          <fa-icon [icon]="faChevronRight" class="text-sm flex-shrink-0" style="color: var(--color-text-muted)" aria-hidden="true"></fa-icon>
        </div>
      </div>
    }
  </div>
</div>

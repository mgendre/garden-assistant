<div class="page-container">
  <div class="page-header">
    <h1 [translate]="'MyPlants.Title'"></h1>
    <p class="page-description" [translate]="'MyPlants.Description'"></p>
  </div>

  <div class="two-col">
    <app-plant-catalogue mode="collection"></app-plant-catalogue>

    <div class="collection">
      @if (store.sortedPlants().length > 0) {
        <div class="plants-list">
          @for (plant of store.sortedPlants(); track plant.id) {
            <app-plant-card [plant]="plant"></app-plant-card>
          }
        </div>
      } @else if (!store.loading()) {
        <app-empty-state icon="🌱" titleKey="MyPlants.EmptyTitle" messageKey="MyPlants.EmptyDesc"></app-empty-state>
      }
    </div>
  </div>
</div>

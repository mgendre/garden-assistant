<div class="panel">
  <div class="panel-header">
    <span class="panel-title" [translate]="'MyPlants.PickerTitle'"></span>
    <span class="plant-count">{{ filteredPlants().length }} {{ 'Companions.PlantCountSuffix' | translate }}</span>
  </div>

  <div class="search-wrap">
    <app-search-input
      [placeholder]="'Companions.SearchPlaceholder' | translate"
      (valueChange)="searchQuery.set($event)">
    </app-search-input>
  </div>

  <div class="plant-list">
    @for (plant of filteredPlants(); track plant.id) {
      <div
        class="plant-item"
        (click)="addPlant(plant)">
        <div class="plant-icon">{{ companionStore.getPlantEmoji(plant) }}</div>
        <div class="plant-info">
          <div class="plant-name">{{ plant.name }}</div>
          @if (plant.family) {
            <div class="plant-family" [class]="companionStore.getFamilyClass(plant.family)">{{ plant.family }}</div>
          }
        </div>
        <fa-icon class="plant-info-btn" [icon]="faInfo" (click)="openPlantDetail(plant, $event)"></fa-icon>
      </div>
    }

    @if (filteredPlants().length === 0) {
      <div class="empty-state">
        <p class="empty-state-text" [translate]="'Companions.NoResults'"></p>
      </div>
    }
  </div>
</div>

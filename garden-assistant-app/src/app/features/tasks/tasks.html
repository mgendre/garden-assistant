<!-- Page header -->
<div class="mb-6 md:mb-8">
  <p class="page-category">{{ 'Tasks.Category' | translate }}</p>
  <h1>{{ 'Tasks.Title' | translate }}</h1>
</div>

<!-- Empty state -->
<div class="empty-state md:!py-24">
  <div class="mb-5 icon-badge-lg">
    <svg class="h-7 w-7 text-canopy md:h-8 md:w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="5" y="3" width="14" height="18" rx="2" />
      <path stroke-linecap="round" d="M9 8h6M9 12h6M9 16h4" />
    </svg>
  </div>
  <h2>{{ 'Tasks.EmptyTitle' | translate }}</h2>
  <p class="mt-2 max-w-xs text-sm leading-relaxed text-earth">
    {{ 'Tasks.EmptyDesc' | translate }}
  </p>
  <span class="mt-4 inline-block rounded-full bg-canopy/10 px-4 py-1.5 text-xs font-semibold text-canopy">
    {{ 'Tasks.ComingSoon' | translate }}
  </span>
</div>

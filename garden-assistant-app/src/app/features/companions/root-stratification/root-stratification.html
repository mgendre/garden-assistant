<div class="soil-rows">
    @for (layer of layers; track layer.depth) {
        @let plants = rootDepthGroups().get(layer.depth) ?? [];
        <div class="soil-row" [ngClass]="layer.cssClass">
            <button class="soil-row-label" [disabled]="!interactive()" (click)="onFilterClick(layer.depth)">
                {{ layer.labelKey | translate }}
                <span class="soil-row-range">{{ layer.rangeKey | translate }}</span>
            </button>
            <div class="soil-plant-chips">
                @if (plants.length === 0) {
                    <span class="soil-empty">{{ 'Stratification.EmptyBand' | translate }}</span>
                }
                @for (plant of plants; track plant.id) {
                    <span class="soil-plant-chip soil-plant-chip--clickable" (click)="openPlantDetail(plant)">{{ plant.name }}</span>
                }
            </div>
            @if (interactive()) {
                <button class="soil-filter-btn"
                    [class.soil-filter-active]="rootDepthFilter() === layer.depth"
                    (click)="onFilterClick(layer.depth)">
                    <fa-icon [icon]="faFilter"></fa-icon>
                </button>
            }
        </div>
    }
</div>
@if (hasCompetitionRisk()) {
    <div style="margin-top: 0.5rem">
        <app-info-banner emoji="ℹ️" messageKey="Stratification.DensityWarning"></app-info-banner>
    </div>
}

@if (store.selectedPlants().length === 0 && !store.isFormVisible()) {
  <div class="panel center-panel">
    <app-empty-state icon="🌱" messageKey="Companions.SelectPlant"></app-empty-state>
  </div>
} @else if (store.selectedPlants().length > 0) {
  <div class="plants-scroll">
    @for (plant of store.sortedSelectedPlants(); track plant.id) {
      <div class="plant-detail" [class.plant-detail--central]="store.isCentralPlant(plant.id)">
        <app-plant-card
          [plant]="plant"
          [removable]="true"
          [showCentralToggle]="store.selectedPlants().length >= 2"
          [isCentral]="store.isCentralPlant(plant.id)"
          [showCentralIndicator]="store.isCentralPlant(plant.id)"
          [relationalMechanisms]="store.relationalMechanismsByPlant().get(plant.id!) ?? []"
          (remove)="store.removePlant(plant)"
          (centralToggle)="store.toggleCentralPlant(plant.id!)">
        </app-plant-card>
      </div>
    }
  </div>
  @if (store.selectedPlants().length >= 2 && !store.hasCentralPlants()) {
    <div class="central-plant-hint">
      <span>⭐</span>
      <span [translate]="'Guild.CentralPlantHint'"></span>
    </div>
  }
}

<div class="guild-panel-search">
  <app-search-input
    [placeholder]="'Guilds.SearchPlaceholder' | translate"
    (valueChange)="searchQuery.set($event)">
  </app-search-input>
</div>

<div class="guild-panel-grid">
  @for (guild of filteredGuilds(); track guild.id) {
    <app-guild-card
      [guild]="guild"
      [showOpenButton]="true"
      [showPlantAdd]="true"
      [showAddAll]="true"
      (view)="viewGuild(guild)"
      (edit)="editGuild(guild)"
      (plantClick)="showPlantDetail($event)"
      (plantAdd)="addPlant($event)"
      (addAllPlants)="addAllPlantsFromGuild(guild)">
    </app-guild-card>
  }

  @if (filteredGuilds().length === 0 && searchQuery()) {
    <app-empty-state messageKey="Companions.NoResults"></app-empty-state>
  }
</div>
